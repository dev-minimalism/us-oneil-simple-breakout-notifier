name: Deploy to Server

on:
  push:
    branches:
      - develop
  workflow_dispatch:  # 수동 실행 가능

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Stop existing process
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo ">>> 기존 프로세스 종료 중..."
            pkill -f "python.*us_oneil_simple" || echo "실행 중인 프로세스 없음"

      - name: Wait for process to stop
        run: sleep 3

      - name: Deploy and start bot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /home/${{ secrets.SSH_USER }}/code/us-oneil-simple-breakout-notifier

            echo "=== 배포 시작: $(date) ==="

            # 1. 최신 코드 가져오기
            echo ">>> Git pull..."
            git fetch origin
            git reset --hard origin/develop

            # 2. 가상환경 생성 (없으면) 및 의존성 설치
            echo ">>> 의존성 설치..."
            if [ ! -d ".venv" ]; then
              echo ">>> 가상환경 생성..."
              python3 -m venv .venv
            fi
            source .venv/bin/activate
            pip install -e . --quiet

            # 3. 봇 시작
            echo ">>> 봇 시작..."
            mkdir -p logs
            setsid nohup .venv/bin/python3 -u -m us_oneil_simple > logs/bot_$(date +%Y%m%d).log 2>&1 &
            sleep 3

            # 4. 실행 확인
            if pgrep -f "python.*us_oneil_simple" > /dev/null; then
              echo ">>> 봇 시작 완료! PID: $(pgrep -f 'python.*us_oneil_simple')"
            else
              echo ">>> 봇 시작 실패!"
              exit 1
            fi

            echo "=== 배포 완료: $(date) ==="
